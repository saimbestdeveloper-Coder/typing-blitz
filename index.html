<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Type Duel</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f8;--grid:#d5e0ec;--ink:#1b1f3b;--you:#e4372c;--bot:#2563eb;--hi:#ffe14d;--panel:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14182b;--grid:#1f2540;--ink:#f1f3ff;--panel:#1d2340;--hi:#ffd92e}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:'Patrick Hand','Comic Sans MS',cursive,sans-serif;font-size:20px;display:flex;justify-content:center}
main{width:100%;max-width:760px;padding:16px;display:flex;flex-direction:column;gap:12px}
h1{font-family:'Permanent Marker','Marker Felt',cursive;font-size:clamp(28px,6vw,44px);margin:0;text-align:center;letter-spacing:1px}
.bars{display:flex;gap:12px;justify-content:space-between}
.bar{flex:1}
.bar b{display:block;margin-bottom:2px}
.hp{height:18px;border:3px solid var(--ink);border-radius:10px;background:var(--panel);overflow:hidden}
.hp i{display:block;height:100%;width:100%;transition:width .3s}
#hpYou i{background:var(--you)}#hpBot i{background:var(--bot)}
.right{text-align:right}
#wordBox{background:var(--panel);border:4px solid var(--ink);border-radius:14px;padding:18px 10px;text-align:center;box-shadow:6px 6px 0 var(--ink);min-height:96px}
#word{font-family:'Permanent Marker',cursive;font-size:clamp(34px,9vw,62px);letter-spacing:3px;overflow-wrap:anywhere}
#word .ok{color:var(--you)}#word .cur{background:var(--hi);border-radius:4px}
#word.bad{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#botProg{height:6px;background:var(--bot);width:0;border-radius:3px;margin-top:10px;transition:width .08s linear}
#stage{background:var(--panel);border:4px solid var(--ink);border-radius:14px;height:auto;aspect-ratio:700/250;position:relative;overflow:hidden}
#stage svg{width:100%;height:auto;display:block}
.man{transition:transform .12s}
.man line,.man circle{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.man circle{fill:var(--panel)}
#you line.c,#you circle{stroke:var(--you)}#bot line.c,#bot circle{stroke:var(--bot)}
.arm{transition:transform .1s;transform-box:fill-box}
#you.punch{transform:translateX(70px)}#bot.punch{transform:translateX(-70px)}
#you.hurt,#bot.hurt{animation:shake .3s}
#you.dead{transform:translateY(60px) rotate(80deg);transform-origin:center}
#bot.dead{transform:translateY(60px) rotate(-80deg);transform-origin:center}
#pow{position:absolute;left:50%;top:30%;transform:translateX(-50%) scale(0);font-family:'Permanent Marker',cursive;font-size:44px;color:var(--hi);-webkit-text-stroke:2px var(--ink);transition:transform .15s;pointer-events:none}
#pow.on{transform:translateX(-50%) scale(1.2)}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
button,select{font:inherit;color:var(--ink);background:var(--hi);border:3px solid var(--ink);border-radius:10px;padding:8px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible,select:focus-visible{outline:3px solid var(--bot);outline-offset:2px}
#msg{text-align:center;min-height:28px}
#hidden{position:absolute;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#you,#bot{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}#you{stroke:var(--you)}#bot{stroke:var(--bot)}#you circle,#bot circle{fill:var(--panel)}#hud{position:absolute;left:10px;bottom:8px;display:flex;gap:14px;background:var(--panel);border:3px solid var(--ink);border-radius:10px;padding:2px 12px;font-size:17px;box-shadow:3px 3px 0 var(--ink)}
#hud b{font-family:'Permanent Marker',cursive;color:var(--you);font-weight:400}
#stage.shake{animation:shake .25s}
.spark{stroke-width:4;stroke-linecap:round;animation:sp .45s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.ring{fill:none;stroke:var(--hi);stroke-width:5;transform-box:fill-box;transform-origin:center;animation:rg .4s ease-out forwards}
@keyframes rg{from{transform:scale(.2);opacity:1}to{transform:scale(2.8);opacity:0}}
.imp{transform-box:fill-box;transform-origin:center;animation:imp .75s ease-out forwards}
@keyframes imp{0%{transform:scale(.1) rotate(-25deg)}22%{transform:scale(1.15) rotate(6deg)}65%{opacity:1}100%{transform:scale(1) rotate(0);opacity:0}}
.flame{transform-box:fill-box;transform-origin:bottom;animation:fl .35s ease-in-out infinite alternate}
@keyframes fl{to{transform:scaleY(1.2) scaleX(.9)}}
:root,:root:not([data-theme="light"]){--ink:#2b1d10;--panel:#fff6dc;--hi:#ffd23f;--you:#ff4a3a;--bot:#2f7bff}
body{background:radial-gradient(circle at 50% 0,#2f7d4f,#0f3a26 70%);color:#fdf3cf}
h1{color:#ffe38a;text-shadow:3px 3px 0 #2b1d10}
#wordBox,#hud,button,select{color:var(--ink)}
#wordBox{border-color:#5a3a1e;box-shadow:6px 6px 0 #2b1d10}
#stage{border-color:#5a3a1e}
#pow{display:none!important}
#you,#bot{filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
#you .fist{fill:var(--you)}#bot .fist{fill:var(--bot)}
#call{white-space:nowrap;font-weight:bold}
#hud{flex-wrap:wrap;max-width:calc(100% - 20px)}
#bname{position:absolute;top:8px;right:10px;background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:0 10px;font-size:16px}
#bg.fade{animation:bgf .7s ease-out}
@keyframes bgf{from{opacity:0}to{opacity:1}}
.snow{animation:sn 3s linear infinite}
@keyframes sn{from{transform:translateY(-30px)}to{transform:translateY(40px)}}
.ember{animation:em 2.2s ease-out infinite}
@keyframes em{from{transform:translateY(30px);opacity:1}to{transform:translateY(-70px);opacity:0}}
</style>
</head>
<body>
<main>
<h1>Type Duel</h1>
<div class="bars">
 <div class="bar"><b>You</b><div class="hp" id="hpYou"><i></i></div></div>
 <div class="bar right"><b>Rival</b><div class="hp" id="hpBot"><i></i></div></div>
</div>
<div id="wordBox"><div id="word">Press Space to start</div><div id="botProg"></div></div>
<div id="stage">
 <svg viewBox="0 0 700 250" aria-label="Two martial artists fighting"><g id="bg"></g><g id="you"></g><g id="bot"></g><g id="fx"></g></svg>
 <div id="pow">POW!</div>
 <div id="bname"></div>
 <div id="hud"><span>Speed <b id="wpm">0</b> WPM</span><span>Combo <b id="cmb">0</b></span><span>Accuracy <b id="acc">100%</b></span><span id="call"></span></div>
</div>
<div id="msg" aria-live="polite">First to type the word lands the punch. Empty the rival's bar to win.</div>
<div class="row">
 <label for="arena">Arena</label>
 <select id="arena"><option value="random" selected>Random</option><option value="jungle">Jungle</option><option value="desert">Desert</option><option value="snow">Snow</option><option value="volcano">Volcano</option><option value="beach">Beach</option></select>
 <label for="lvl">Rival speed</label>
 <select id="lvl"><option value="1.6">Easy</option><option value="2.6" selected>Medium</option><option value="4">Hard</option></select>
 <button id="start">Start fight (Space)</button>
</div>
<input id="hidden" autocomplete="off" autocapitalize="off" aria-label="Typing input">
</main>

const S={l:8,a:45,b:140,c:20,d:130,e:28,f:5,g:-25,h:-15,x:0,y:0};
const mk=o=>({...S,...o});
const POSE={

};
const COMBO=["jab","cross","front","upper","jab","round","cross","high"];

const you=Man("you",290,1),bot=Man("bot",410,-1);
function go(m,p,hold=260){m.tgt={...p};clearTimeout(m.t);if(!m.dead&&p!==POSE.win)m.t=setTimeout(()=>{m.tgt={...S}},hold)}
const seg=(x,y,a,L,f)=>{const r=a*Math.PI/180;return[x+Math.sin(r)*L*f,y+Math.cos(r)*L]};
function draw(m){
 const c=m.cur,f=m.face,hx=m.x+c.x*f,hy=130+c.y+(m.dead?0:Math.sin(performance.now()/180+m.face)*1.6),lr=c.l*Math.PI/180;
 const sx=hx+Math.sin(lr)*48*f,sy=hy-Math.cos(lr)*48,dx=sx+Math.sin(lr)*18*f,dy=sy-Math.cos(lr)*18;
 const limb=(x,y,a,b,l,fist)=>{const p=seg(x,y,a,l,f),q=seg(p[0],p[1],b,l,f);return `<polyline points="${x},${y} ${p[0]},${p[1]} ${q[0]},${q[1]}"/>`+(fist?`<circle class="fist" cx="${q[0]}" cy="${q[1]}" r="6"/>`:"")};
 const g=$(m.id);
 g.innerHTML=`<circle cx="${dx}" cy="${dy}" r="16"/><line x1="${sx}" y1="${sy}" x2="${hx}" y2="${hy}"/>`+limb(sx,sy,c.c,c.d,27,1)+limb(hx,hy,c.g,c.h,30)+limb(hx,hy,c.e,c.f,30)+limb(sx,sy,c.a,c.b,27,1);
 g.setAttribute("transform",m.dead?`translate(0 40) rotate(${-85*f} ${hx} ${hy})`:"");
}
function tick(){for(const m of[you,bot]){for(const k in m.cur)m.cur[k]+=(m.tgt[k]-m.cur[k])*.3;draw(m)}requestAnimationFrame(tick)}

snow:{name:"Frozen Peaks",page:["#6aa3d6","#1d3b66"],svg:`<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb9e6"/><stop offset="1" stop-color="#eaf6ff"/></linearGradient></defs><rect width="700" height="250" fill="url(#sk)"/><polygon points="0,190 90,92 180,190" fill="#8aa7c9"/><polygon points="150,190 280,70 410,190" fill="#7a99bd"/><polygon points="400,190 540,96 690,190" fill="#8aa7c9"/><g fill="#fff"><polygon points="90,92 112,122 68,122"/><polygon points="280,70 306,110 254,110"/><polygon points="540,96 566,130 514,130"/></g><g fill="#1f5a45"><polygon points="30,190 52,126 74,190"/><polygon points="60,190 80,140 100,190"/><polygon points="620,190 644,122 668,190"/><polygon points="660,190 682,138 700,190"/></g><g fill="#fff"><polygon points="52,126 62,146 42,146"/><polygon points="644,122 655,144 633,144"/></g><g class="snow" fill="#fff">${gen(22,i=>`<circle cx="${(i*47)%700}" cy="${(i*71)%200}" r="${2+i%3}"/>`)}</g><rect y="190" width="700" height="60" fill="#dff1fb"/><rect y="186" width="700" height="8" fill="#fff"/><ellipse cx="150" cy="215" rx="70" ry="8" fill="#bfe3f5"/><ellipse cx="520" cy="225" rx="90" ry="9" fill="#bfe3f5"/>`},
volcano:{name:"Volcano Rim",page:["#7a2410","#1a0a0a"],svg:`<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0c1c"/><stop offset="1" stop-color="#ff7a2e"/></linearGradient></defs><rect width="700" height="250" fill="url(#sk)"/><circle cx="360" cy="36" r="20" fill="#3d2a30" opacity=".7"/><circle cx="385" cy="18" r="16" fill="#3d2a30" opacity=".6"/><polygon points="160,190 300,72 340,60 380,60 420,72 560,190" fill="#2b1612"/><polygon points="340,60 360,52 380,60 370,74 350,74" fill="#ff7a1f"/><g fill="none" stroke="#ff6a1f" stroke-width="6" stroke-linecap="round"><path d="M356 74 q-10 40 -26 70 q-8 24 -22 46"/><path d="M372 74 q12 36 22 64 q8 26 24 52"/></g><polygon points="0,190 40,138 90,190" fill="#3a2424"/><polygon points="620,190 660,130 700,190" fill="#3a2424"/><g class="ember" fill="#ffb347">${gen(16,i=>`<circle cx="${(i*53)%700}" cy="${120+(i*37)%70}" r="${1.5+i%2}"/>`)}</g><rect y="190" width="700" height="60" fill="#3b2626"/><rect y="186" width="700" height="8" fill="#5a3a30"/><g fill="none" stroke="#ff7a1f" stroke-width="3" stroke-linecap="round"><path d="M30 212 l40 8 30 -8 50 12"/><path d="M300 224 l36 -8 40 10 36 -6"/><path d="M520 210 l30 10 40 -10 60 12"/></g>`},
beach:{name:"Coral Beach",page:["#27a9d8","#0b4f78"],svg:`<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#66c8f5"/><stop offset="1" stop-color="#dff8ff"/></linearGradient></defs><rect width="700" height="250" fill="url(#sk)"/><circle cx="560" cy="58" r="34" fill="#fff4a8"/><g fill="#fff" opacity=".9"><ellipse cx="150" cy="50" rx="46" ry="12"/><ellipse cx="180" cy="42" rx="30" ry="10"/><ellipse cx="380" cy="72" rx="40" ry="10"/></g><rect y="118" width="700" height="72" fill="#1e90d6"/><path d="M0 138 ${"q25-9 50 0 t50 0 ".repeat(7)}" fill="none" stroke="#8fdcff" stroke-width="3"/><path d="M0 160 ${"q25-9 50 0 t50 0 ".repeat(7)}" fill="none" stroke="#5bbcf0" stroke-width="3"/><rect x="470" y="70" width="16" height="50" fill="#fff"/><rect x="470" y="86" width="16" height="9" fill="#e4372c"/><polygon points="466,70 478,56 490,70" fill="#e4372c"/><g id="palm"><path d="M40 190 q12-60 -4-112" stroke="#7a4b22" stroke-width="10" fill="none" stroke-linecap="round"/><g fill="#2f9e4f"><ellipse cx="14" cy="84" rx="32" ry="9" transform="rotate(-22 36 78)"/><ellipse cx="58" cy="82" rx="32" ry="9" transform="rotate(24 36 78)"/><ellipse cx="36" cy="64" rx="28" ry="8" transform="rotate(-82 36 78)"/><ellipse cx="30" cy="76" rx="30" ry="8" transform="rotate(8 36 78)"/></g></g><use href="#palm" transform="translate(700 0) scale(-1 1)"/><rect y="190" width="700" height="60" fill="#f2d79a"/><rect y="184" width="700" height="8" fill="#ffe9b3"/>`}
};
let curBiome="jungle";
function setBiome(k){curBiome=k;const b=BIOMES[k],g=$("bg");g.innerHTML=b.svg;g.classList.remove("fade");void g.getBoundingClientRect();g.classList.add("fade");
 document.body.style.background=`radial-gradient(circle at 50% 0,${b.page[0]},${b.page[1]} 70%)`;$("bname").textContent=b.name}
function pickBiome(){const ks=Object.keys(BIOMES).filter(k=>k!==curBiome);return ks[Math.floor(Math.random()*ks.length)]}
let rounds=0,fighting=false;
let typed=0,wrong=0,t0=0,combo=0,hudT=null;
const NS="http://www.w3.org/2000/svg";
function burst(x,y,col,n,nr){const g=$("fx");
 if(!nr){const r=document.createElementNS(NS,"circle");r.setAttribute("cx",x);r.setAttribute("cy",y);r.setAttribute("r",18);r.setAttribute("class","ring");g.appendChild(r);setTimeout(()=>r.remove(),450)}
 for(let i=0;i<n;i++){const a=Math.random()*6.28,d=40+Math.random()*60,l=document.createElementNS(NS,"line");
  l.setAttribute("x1",x);l.setAttribute("y1",y);l.setAttribute("x2",x+Math.cos(a)*9);l.setAttribute("y2",y+Math.sin(a)*9);
  l.style.setProperty("--dx",Math.cos(a)*d+"px");l.style.setProperty("--dy",Math.sin(a)*d+"px");l.setAttribute("class","spark");l.style.stroke=col;g.appendChild(l);setTimeout(()=>l.remove(),500)}}
function fx(def,blocked){burst(def.x+def.face*26,95,blocked?"#38bdf8":"#ffb400",blocked?8:18);
 if(!blocked){const s=$("stage");s.classList.remove("shake");void s.offsetWidth;s.classList.add("shake")}}
function hud(){const m=Math.max((Date.now()-t0)/60000,1/60);$("wpm").textContent=t0?Math.round(typed/5/m):0;$("cmb").textContent=combo;$("acc").textContent=(typed+wrong?Math.round(typed/(typed+wrong)*100):100)+"%"}
let hp={you:100,bot:100},word="",pos=0,live=false,timer=null,prog=0,botN=0,speed=2.6;
function setHp(){$("hpYou").firstElementChild.style.width=hp.you+"%";$("hpBot").firstElementChild.style.width=hp.bot+"%"}
function render(){const w=$("word");w.innerHTML="";[...word].forEach((ch,i)=>{const s=document.createElement("span");s.textContent=ch;if(i<pos)s.className="ok";else if(i===pos)s.className="cur";w.appendChild(s)})}
function nextWord(){if($("arena").value==="random"&&rounds>0&&rounds%5===0)setBiome(pickBiome());rounds++;let w;do{w=WORDS[Math.floor(Math.random()*WORDS.length)]}while(w===word);word=w;pos=0;prog=0;botN=0;$("botProg").style.width="0";render();live=true}
const NAMES={high:"Sky kick",round:"Roundhouse",cross:"Iron fist",front:"Front kick",flying:"Flying kick",spin:"Spin kick",axe:"Axe kick"};
const BAM=["SMASH!","BAM!","WHAM!","CRACK!","THWACK!"];
const MOVES=["jab","cross","upper","overhand","front","side","round","high","axe","spin"];
let ct=0;
function call(t){$("call").textContent=t;clearTimeout(ct);ct=setTimeout(()=>$("call").textContent="",2000)}
function attack(m,n,hold){clearTimeout(m.w);go(m,POSE.wind,40);m.until=Date.now()+hold+70;m.w=setTimeout(()=>go(m,POSE[n],hold),70)}
function strike(m){let n;do{n=MOVES[Math.floor(Math.random()*MOVES.length)]}while(n===m.last);m.last=n;attack(m,n,230);
 const d=m===you?bot:you;
 setTimeout(()=>{if(!live)return;burst(d.x+d.face*22,100,m===you?"#ffb347":"#7cc4ff",4,1);if(Date.now()>d.until)go(d,mk({l:-6,x:-7,a:50,b:130}),110)},130)}
function impact(d,txt,col,sc){
 let pts="";for(let i=0;i<20;i++){const r=i%2?28:46,a=i*Math.PI/10;pts+=(Math.cos(a)*r).toFixed(1)+","+(Math.sin(a)*r).toFixed(1)+" "}
 const e=document.createElementNS(NS,"g");e.setAttribute("transform",`translate(${d.x+d.face*22} 78) scale(${sc})`);
 e.innerHTML=`<g class="imp"><polygon points="${pts}" fill="${col}" stroke="#2b1d10" stroke-width="4" stroke-linejoin="round"/><text y="6" text-anchor="middle" font-family="Permanent Marker,cursive" font-size="16" fill="#fff" stroke="#2b1d10" stroke-width="5" paint-order="stroke">${txt}</text></g>`;
 $("fx").appendChild(e);setTimeout(()=>e.remove(),750)}
function hit(who){
 if(!live)return;live=false;
 const att=who==="you"?you:bot,def=who==="you"?bot:you,k=who==="you"?"bot":"you",me=who==="you"?"You":"Rival";
 if(who==="you")combo++;else combo=0;
 const ratio=who==="you"?prog/word.length:pos/word.length,blocked=ratio>=0.5;
 const mv=FIN[Math.floor(Math.random()*FIN.length)],dmg=blocked?5:(who==="you"?20+Math.min(combo-1,3)*5:20);
 attack(att,mv,520);
 setTimeout(()=>{
  hp[k]=Math.max(0,hp[k]-dmg);setHp();
  go(def,blocked?POSE.block:POSE.hurt,blocked?520:420);
  impact(def,blocked?"CLANG!":BAM[Math.floor(Math.random()*BAM.length)],blocked?"#7dd3fc":"#ff9f1c",blocked?1:1.3);
  fx(def,blocked);
  call(me+": "+NAMES[mv]+(blocked?" blocked, -5":", -"+dmg)+(who==="you"&&combo>1&&!blocked?"  COMBO x"+combo:""));
  hud();
 },210);
 $("msg").textContent=blocked?(k==="you"?"You blocked it and counter-punched!":"Rival blocked and counter-punched!"):(who==="you"?"You got there first!":"Rival was faster!");
 if(blocked){
  setTimeout(()=>{attack(def,"cross",420);setTimeout(()=>{go(att,POSE.hurt,350);hp[who]=Math.max(0,hp[who]-5);setHp();impact(att,"WHAM!","#ff9f1c",1);burst(att.x+att.face*26,95,"#ffb400",12);call((k==="you"?"You":"Rival")+": counter punch, -5")},210)},650);
 }
 setTimeout(()=>{if(hp.you<=0||hp.bot<=0)end();else nextWord()},blocked?1350:800);
}
function end(){
 clearInterval(timer);clearInterval(hudT);fighting=false;const won=hp.bot<=0,L=won?bot:you,W=won?you:bot;
 L.dead=true;go(L,POSE.hurt);go(W,POSE.win);burst(L.x,100,"#ffb400",30);
 $("word").textContent=won?"You win!":"Rival wins";
 hud();$("msg").textContent=(won?"Knockout! ":"Knocked out. ")+$("wpm").textContent+" WPM, "+$("acc").textContent+" accuracy. Press Space to play again.";
 $("start").textContent="Play again (Space)";live=false;
}
function start(){
 clearInterval(timer);fighting=true;rounds=0;{const v=$("arena").value;setBiome(v==="random"?pickBiome():v)}typed=wrong=0;combo=0;t0=Date.now();clearInterval(hudT);hudT=setInterval(hud,400);hud();$("call").textContent="";hp={you:100,bot:100};setHp();
 for(const m of[you,bot]){m.dead=false;m.tgt={...S}}
 speed=parseFloat($("lvl").value);$("msg").textContent="Type the word!";
 $("hidden").focus();nextWord();
 timer=setInterval(()=>{if(!live)return;
  prog+=speed*(0.5+Math.random())*0.06;
  $("botProg").style.width=Math.min(100,prog/word.length*100)+"%";
  const n=Math.floor(prog);if(n>botN&&n<word.length){botN=n;strike(bot)}
  if(prog>=word.length)hit("bot")},60);
}
function press(k){
 if(!live||k.length!==1)return;
 if(k.toLowerCase()===word[pos]){typed++;pos++;render();if(pos===word.length)hit("you");else strike(you)}
 else{wrong++;const w=$("word");w.classList.remove("bad");void w.offsetWidth;w.classList.add("bad")}
}
document.addEventListener("keydown",e=>{
 if(e.target.tagName==="SELECT"||e.ctrlKey||e.metaKey)return;
 if(e.code==="Space"){e.preventDefault();if(!fighting&&!e.repeat)start();return}
 press(e.key)});
document.addEventListener("keyup",e=>{if(e.code==="Space"&&e.target.tagName==="BUTTON")e.preventDefault()});
$("hidden").addEventListener("input",e=>{const v=e.target.value;if(v)press(v.slice(-1));e.target.value=""});
$("start").addEventListener("click",start);
$("wordBox").addEventListener("click",()=>$("hidden").focus());
setHp();setBiome("jungle");
$("arena").addEventListener("change",e=>{const v=e.target.value;setBiome(v==="random"?pickBiome():v)});
</script>
